name: probe-gov

# ONE-OFF diagnostic (manual only), round 3 — CBS only. BoI is solved (headless
# Chromium renders its list; see desk/collect_gov.py). This renders CBS's
# media-release page in Chromium and records (a) the release links that appear,
# (b) every JSON/API request the page makes, (c) whether the SharePoint search
# REST endpoint answers. Output is SHORT on purpose. Delete after use.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium

      - name: Headless Chromium vs CBS media releases
        run: |
          python3 - <<'PY'
          import re
          from playwright.sync_api import sync_playwright
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True, args=["--disable-blink-features=AutomationControlled"])
              ctx = b.new_context(user_agent=UA, locale="he-IL", viewport={"width": 1366, "height": 900})
              ctx.add_init_script("Object.defineProperty(navigator,'webdriver',{get:()=>undefined})")
              pg = ctx.new_page()
              reqs = []
              pg.on("response", lambda r: reqs.append((r.status, r.request.method, r.url)) if re.search(r"_api|\.ashx|\.svc|json|search|mediarelease", r.url, re.I) and not re.search(r"\.(png|jpg|svg|css|woff2?)(\?|$)", r.url, re.I) else None)
              try:
                  pg.goto("https://www.cbs.gov.il/he/mediarelease/Pages/default.aspx", wait_until="domcontentloaded", timeout=45000)
                  pg.wait_for_timeout(12000)
              except Exception as e:
                  print("goto issue:", repr(e))
              print("title:", pg.title())
              links = pg.eval_on_selector_all("a", "els => els.map(e => [e.href, (e.innerText||'').trim().replace(/\\s+/g,' ').slice(0,90)])")
              rel = [l for l in links if re.search(r"mediarelease|/he/mediarelease/pages/", l[0], re.I) and l[1]]
              print("anchors total:", len(links), "| mediarelease-ish:", len(rel))
              for l in rel[:15]: print("  ", l)
              print("API-ish responses:", len(reqs))
              for r in reqs[:20]: print("  ", r)
              body = pg.inner_text("body")
              print("body text sample:", re.sub(r"\s+", " ", body)[:600])
              for q in ["querytext='ContentType:*'&rowlimit=3", "querytext='mediarelease'&rowlimit=3"]:
                  try:
                      r = pg.request.get("https://www.cbs.gov.il/_api/search/query?" + q, headers={"Accept": "application/json;odata=nometadata"})
                      print("search API", q, "->", r.status, r.text()[:300].replace("\n", " "))
                  except Exception as e:
                      print("search API", q, "FAILED", repr(e)[:200])
              b.close()
          PY
