name: probe-gov

# ONE-OFF diagnostic (manual only), round 4. CBS is blocked at the data level for
# a runner (round 3: the page renders, its SharePoint search call is reset, and
# the results box says "something went wrong"). Last candidate: Google News RSS
# restricted to cbs.gov.il — how FRESH and how COMPLETE is it? Prints items
# newest-first. Result is published as an annotation (API-readable). Delete after use.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Google News RSS for cbs.gov.il
        run: |
          python3 - <<'PY' 2>&1 | tee /tmp/probe_out.txt
          import re, urllib.request, html
          from email.utils import parsedate_to_datetime
          from urllib.parse import quote
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) DeskCollector/0.1"
          QS = ["site:cbs.gov.il when:14d", "site:cbs.gov.il הודעות לתקשורת when:14d", "site:cbs.gov.il/he/mediarelease when:30d"]
          for q in QS:
              u = "https://news.google.com/rss/search?q=%s&hl=he&gl=IL&ceid=IL:he" % quote(q, safe="")
              try:
                  req = urllib.request.Request(u, headers={"User-Agent": UA})
                  b = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "replace")
              except Exception as e:
                  print("Q", q, "FAILED", repr(e)); continue
              items = re.findall(r"<item>(.*?)</item>", b, re.S)
              rows = []
              for it in items:
                  t = html.unescape(re.search(r"<title>(.*?)</title>", it, re.S).group(1))
                  d = re.search(r"<pubDate>(.*?)</pubDate>", it)
                  dt = parsedate_to_datetime(d.group(1)) if d else None
                  rows.append((dt, t))
              rows.sort(key=lambda r: r[0] or 0, reverse=True)
              print("Q", q, "items", len(rows))
              for dt, t in rows[:14]: print("  ", dt.strftime("%Y-%m-%d %H:%M") if dt else "?", "|", t[:110])
          PY

      - name: Publish result as annotation (readable via API)
        if: always()
        run: |
          python3 - <<'PY'
          t = open("/tmp/probe_out.txt", encoding="utf-8", errors="replace").read()[:30000]
          t = t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::notice title=cbs-probe::" + t)
          PY
